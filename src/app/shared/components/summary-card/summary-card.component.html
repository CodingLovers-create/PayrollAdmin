<div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant shadow-sm flex flex-col justify-between min-h-[140px] relative overflow-hidden h-full">
  @if (borderType === 'amber') {
    <div class="absolute left-0 top-0 bottom-0 w-1 bg-amber-400"></div>
  } @else if (borderType === 'teal') {
    <div class="absolute left-0 top-0 bottom-0 w-1 bg-teal-400"></div>
  }

  <h3 class="font-label-md text-label-md text-outline uppercase tracking-wider">{{ title }}</h3>
  
  <div class="flex items-end justify-between mt-4">
    @if (subValue) {
      <div class="flex items-baseline gap-1 leading-none">
        <span class="font-headline-lg text-headline-lg text-on-surface">{{ mainValue }}</span>
        <span class="font-headline-sm text-headline-sm text-on-surface">{{ subValue }}</span>
      </div>
    } @else {
      <span class="font-headline-lg text-headline-lg text-on-surface">{{ mainValue }}</span>
    }

    <span class="flex items-center gap-0.5 font-label-md text-label-md px-2 py-1 rounded"
      [ngClass]="{
        'text-emerald-700 bg-emerald-50': badgeType === 'success',
        'text-amber-800 bg-amber-50': badgeType === 'warning',
        'text-error bg-error-container border border-error-container': badgeType === 'danger'
      }">
      @if (badgeIcon) {
        <span class="material-symbols-outlined text-[14px]">{{ badgeIcon }}</span>
      }
      {{ badgeText }}
    </span>
  </div>
</div>
