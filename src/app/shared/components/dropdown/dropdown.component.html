<div class="relative inline-block text-left w-full sm:w-auto">
  <button 
    (click)="toggleDropdown()"
    type="button" 
    class="flex w-full sm:w-auto items-center justify-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-sm font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors whitespace-nowrap">
    {{ selectedLabel }}
    <span class="material-symbols-outlined text-[18px]">expand_more</span>
  </button>

  @if (isOpen) {
    <div class="absolute right-0 mt-2 w-48 rounded-xl shadow-lg bg-surface-container-lowest border border-outline-variant z-50 overflow-hidden">
      <div class="py-1" role="menu" aria-orientation="vertical">
        @for (option of options; track option.value) {
          <a 
            (click)="selectOption(option)"
            class="block px-4 py-2 text-sm text-on-surface hover:bg-surface-container-low cursor-pointer transition-colors"
            [ngClass]="{'bg-primary/10 text-primary font-medium': option.value === selectedValue}"
            role="menuitem">
            {{ option.label }}
          </a>
        }
      </div>
    </div>
  }
</div>
