<div class="p-6 md:p-8 max-w-7xl mx-auto w-full">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-bold text-slate-900 mb-1">Roles Management</h1>
      <p class="text-slate-500 text-sm">Define roles and assign permissions.</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-semibold hover:bg-slate-800 transition">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Create Role
      </button>
    </div>
  </div>

  <!-- Main Card -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-white border-b border-slate-200">
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider w-1/4">Role Name</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider">Description</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider w-32 text-center">Users</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right w-24">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (role of roles; track role.id) {
            <tr class="hover:bg-slate-50 transition group">
              <td class="py-4 px-6 whitespace-nowrap font-medium text-slate-900">{{ role.name }}</td>
              <td class="py-4 px-6 text-slate-500 text-sm">{{ role.description }}</td>
              <td class="py-4 px-6 text-center text-slate-900 font-medium">
                <span class="inline-flex items-center justify-center bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold">{{ role.users }}</span>
              </td>
              <td class="py-4 px-6 whitespace-nowrap text-right">
                <button class="text-slate-400 hover:text-slate-600 p-1.5 rounded-md hover:bg-slate-100 transition">
                  Edit
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <!-- Footer / Pagination -->
    <div class="bg-white rounded-b-xl border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between px-6 py-3">
      <div class="text-sm text-slate-500 mb-4 sm:mb-0">Showing 1 to {{ totalRoles }} of {{ totalRoles }} roles</div>
      <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination>
    </div>
  </div>
</div>
