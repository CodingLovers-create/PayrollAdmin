<div class="p-6 md:p-8 max-w-7xl mx-auto w-full">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-bold text-slate-900 mb-1">Permissions Matrix</h1>
      <p class="text-slate-500 text-sm">Review available resource actions and policies.</p>
    </div>
  </div>
  <!-- Main Card -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-white border-b border-slate-200">
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider">Resource</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider">Action</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider">Description</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (perm of permissions; track perm.id) {
            <tr class="hover:bg-slate-50 transition group">
              <td class="py-4 px-6 whitespace-nowrap font-medium text-slate-900">{{ perm.resource }}</td>
              <td class="py-4 px-6 whitespace-nowrap"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium border border-blue-200 bg-blue-50 text-blue-700">{{ perm.action }}</span></td>
              <td class="py-4 px-6 text-slate-500 text-sm">{{ perm.description }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <!-- Footer / Pagination -->
    <div class="bg-white rounded-b-xl border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between px-6 py-3">
      <div class="text-sm text-slate-500 mb-4 sm:mb-0">Showing 1 to {{ totalPermissions }} of {{ totalPermissions }} permissions</div>
      <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination>
    </div>
  </div>
</div>
