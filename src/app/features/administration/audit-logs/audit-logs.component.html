<div class="p-6 md:p-8 max-w-7xl mx-auto w-full">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-bold text-slate-900 mb-1">Audit Logs</h1>
      <p class="text-slate-500 text-sm">Track system activities and security events.</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50 transition">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Export Logs
      </button>
    </div>
  </div>
  <!-- Main Card -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-white border-b border-slate-200">
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider w-40">Timestamp</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider">User</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider">Action</th>
            <th class="py-4 px-6 text-xs font-semibold text-slate-500 uppercase tracking-wider">Details</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (log of logs; track log.id) {
            <tr class="hover:bg-slate-50 transition group">
              <td class="py-4 px-6 whitespace-nowrap text-sm font-mono text-slate-500">{{ log.timestamp }}</td>
              <td class="py-4 px-6 whitespace-nowrap font-medium text-slate-900">{{ log.user }}</td>
              <td class="py-4 px-6 whitespace-nowrap text-sm text-slate-700 font-semibold">{{ log.action }}</td>
              <td class="py-4 px-6 text-slate-500 text-sm truncate max-w-md">{{ log.details }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <!-- Footer / Pagination -->
    <div class="bg-white rounded-b-xl border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between px-6 py-3">
      <div class="text-sm text-slate-500 mb-4 sm:mb-0">Showing 1 to {{ totalLogs }} of {{ totalLogs }} logs</div>
      <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination>
    </div>
  </div>
</div>
